<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фінансовий калькулятор ФОП</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>💰 Фінансовий калькулятор</h1>
            <p>Дізнайся свій чистий прибуток, точку беззбитковості та запас міцності за 5 секунд</p>
        </header>

        <!-- Input Section -->
        <section class="calculator">
            <div class="input-group">
                <label for="income">Щомісячний дохід (грн) <span class="tooltip">❓<span class="tooltip-text">Всі надходження від діяльності за місяць</span></span></label>
                <input type="number" id="income" placeholder="Наприклад: 50000" value="50000">
            </div>

            <div class="input-group">
                <label for="expenses">Щомісячні витрати (грн) <span class="tooltip">❓<span class="tooltip-text">Оренда, комуналка, зарплата, матеріали тощо</span></span></label>
                <input type="number" id="expenses" placeholder="Наприклад: 30000" value="30000">
            </div>

            <div class="input-group">
                <label for="taxRate">Ставка податку (%) <span class="tooltip">❓<span class="tooltip-text">Для ФОП 3-ї групи — 5%</span></span></label>
                <input type="number" id="taxRate" placeholder="Наприклад: 5" value="5" step="0.1">
            </div>

            <div class="input-group">
                <label for="reserveMonths">Запас міцності (місяців) <span class="tooltip">❓<span class="tooltip-text">На скільки місяців вистачить грошей при падінні доходу</span></span></label>
                <input type="number" id="reserveMonths" placeholder="Наприклад: 3" value="3">
            </div>
        </section>

        <!-- Results -->
        <section class="results">
            <div class="result-card">
                <h3>📊 Чистий прибуток</h3>
                <div class="result-value" id="netProfit">0</div>
                <span class="result-unit">грн / місяць</span>
            </div>

            <div class="result-card">
                <h3>📈 Точка беззбитковості</h3>
                <div class="result-value" id="breakEven">0</div>
                <span class="result-unit">грн / місяць</span>
            </div>

            <div class="result-card">
                <h3>🛡️ Запас міцності</h3>
                <div class="result-value" id="safetyMargin">0</div>
                <span class="result-unit">грн (подушка)</span>
            </div>

            <div class="result-card status-card">
                <h3>🚦 Статус бізнесу</h3>
                <div class="result-value" id="status">✅ Стабільно</div>
            </div>
        </section>

        <!-- Export Button -->
        <button id="exportPDF" class="btn-primary">📥 Завантажити звіт (PDF)</button>

        <!-- Footer -->
        <footer>
            <p>Дані зберігаються тільки у вашому браузері 🔒</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
